name: Testes instrumentados

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '/run-tests'
    steps:
    - name: Verificar permissão
      uses: actions/github-script@v9
      with:
        script: |
          const login = context.payload.comment.user.login;
          const association = context.payload.comment.author_association;
          const allowed = ['OWNER', 'MEMBER'];

          if (!allowed.includes(association)) {
            core.setFailed(`O usuário ${login} não tem permissão para iniciar este workflow.`);
          }

    - uses: actions/checkout@v6
      with:
        ref: refs/pull/${{ github.event.issue.number }}/head

    - name: Publicar comentário de início
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Os testes instrumentados estão rodando. [Ver progresso](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          })

    - name: Configurar o Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Conceder permissão de execução ao gradlew
      run: chmod +x gradlew

    - name: Configurar o cache do Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Obter o SDK alvo
      id: sdk
      run: |
        TARGET_SDK=$(grep 'targetSdk' gradle/libs.versions.toml | grep -o '[0-9]\+' | head -1)
        echo "version=$TARGET_SDK" >> $GITHUB_OUTPUT

    - name: Habilitar o KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Rodar os testes instrumentados
      id: tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ steps.sdk.outputs.version }}
        arch: x86_64
        profile: Nexus 6
        script: ./gradlew connectedPrereleaseDebugAndroidTest

    - name: Enviar os resultados dos testes
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: instrumented-test-results
        path: '**/build/reports/androidTests/'

    - name: Publicar comentário final
      if: always()
      uses: actions/github-script@v9
      with:
        script: |
          const success = '${{ steps.tests.outcome }}' === 'success';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: success
              ? 'Os testes instrumentados passaram. [Ver resultados](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
              : 'Os testes instrumentados falharam. [Ver resultados](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          })
