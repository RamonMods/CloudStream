name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v6

      - name: Configurar o Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar a plataforma do Android necessária
        shell: bash
        run: |
          COMPILE_SDK=$(grep '^compileSdk' gradle/libs.versions.toml | grep -o '[0-9]\+' | head -1)
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-${COMPILE_SDK}" || true
          else
            echo "sdkmanager nao encontrado; usando plataformas ja instaladas no runner"
          fi

      - name: Configurar o cache do Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Conceder permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Preparar chave de assinatura
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            mkdir -p "$HOME/work/_temp/keystore"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$HOME/work/_temp/keystore/keystore.p12"
            {
              echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
              echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
              echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Assinatura preparada."
          else
            echo "Sem chave de assinatura; compilando APK sem assinatura."
          fi

      - name: Compilar o APK de release
        run: ./gradlew assembleRelease

      - name: Enviar os APKs como artefato
        uses: actions/upload-artifact@v4
        with:
          name: apks-release
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar os APKs compilados
        uses: actions/download-artifact@v4
        with:
          name: apks-release
          path: apks

      - name: Publicar a release com os APKs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t APK_FILES < <(find apks -type f -name '*.apk' | sort)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "Nenhum APK encontrado no artefato."
            exit 1
          fi
          gh release create "$TAG" "${APK_FILES[@]}" \
            --title "$TAG" \
            --notes "APKs compilados automaticamente a partir da tag $TAG. Instale o repositório de extensões CloudBrasil em Configurações → Extensões para ter sites e canais."
