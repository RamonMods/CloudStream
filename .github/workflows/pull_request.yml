name: Build de artefato

on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Configurar o Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Conceder permissão de execução ao gradlew
      run: chmod +x gradlew

    - name: Configurar o cache do Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Garantir compatibilidade binária
      # Garante que o código novo continua compatível com versões anteriores.
      # Se falhar, adicione a anotação @Prerelease ao código novo.
      run: ./gradlew library:checkKotlinAbi

    - name: Rodar o Gradle
      run: ./gradlew assemblePrereleaseDebug lint check

    - name: Enviar o artefato
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-build
        path: "app/build/outputs/apk/prerelease/debug/*.apk"
