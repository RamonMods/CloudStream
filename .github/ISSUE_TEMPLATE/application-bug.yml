name: 🐞 Relatório de problema do aplicativo
description: Relate um problema no CloudStream
labels: [bug]
body:

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Passos para reproduzir
      description: Dê um exemplo do problema.
      placeholder: |
        Exemplo:
          1. Primeiro passo
          2. Segundo passo
          3. O problema aparece aqui
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Comportamento esperado
      placeholder: |
        Exemplo:
          "Deveria acontecer isto..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Comportamento atual
      placeholder: |
        Exemplo:
          "Aconteceu isto no lugar..."
    validations:
      required: true

  - type: input
    id: cloudstream-version
    attributes:
      label: Versão do CloudStream e hash do commit
      description: |
        A versão aparece em **Configurações**. O hash do commit são os 7 caracteres ao lado da versão.
      placeholder: |
        Exemplo: "2.8.16 a49f466"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Versão do Android
      description: |
        Você encontra isso nas configurações do Android.
      placeholder: |
        Exemplo: "Android 12"
    validations:
      required: true

  - type: textarea
    id: logcat
    attributes:
      label: Logcat
      placeholder: |
        Para pegar o logcat: Configurações > Atualizações e backup > Mostrar logcat 🐈.
        Se o arquivo for grande, anexe um arquivo ou cole um link de um serviço de paste.
      render: java

  - type: textarea
    id: other-details
    attributes:
      label: Outros detalhes
      placeholder: |
        Detalhes adicionais e anexos.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Confirmações
      description: Sua issue será fechada se estes passos não forem cumpridos.
      options:
        - label: Tenho certeza de que o problema é do aplicativo e **NÃO de alguma extensão**.
          required: true
        - label: Procurei nas issues existentes e este é um novo relato, **NÃO** é duplicado nem relacionado a outra issue aberta.
          required: true
        - label: Escrevi um título curto e informativo.
          required: true
        - label: Estou usando a versão mais recente compilada pela CI **[Actions](https://github.com/RamonMods/CloudStream/actions/workflows/build-apk.yml)**.
          required: true
        - label: Vou preencher todas as informações pedidas neste formulário.
          required: true
