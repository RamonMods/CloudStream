name: ⭐ Sugestão de funcionalidade
description: Sugira uma funcionalidade para melhorar o aplicativo
labels: [enhancement]
body:

  - type: textarea
    id: feature-description
    attributes:
      label: Descreva a funcionalidade sugerida
      description: Como o aplicativo pode ser melhorado?
      placeholder: |
        Exemplo:
          "Deveria funcionar assim..."
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Outros detalhes
      placeholder: |
        Detalhes adicionais e anexos.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Confirmações
      description: Sua issue será fechada se estes passos não forem cumpridos.
      options:
        - label: Minha sugestão **NÃO** é sobre adicionar um novo provedor
          required: true
        - label: Procurei nas issues existentes e este é um novo relato, **NÃO** é duplicado nem relacionado a outra issue aberta.
          required: true
